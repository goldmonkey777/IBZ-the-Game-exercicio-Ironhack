<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBZ the GAME</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <section id="map" style="position: relative; width: 800px; height: 600px; background: #bfe7f2;">
      <img src="assets/images/istockphoto-516624722-612x612.jpg" alt="Mapa de Ibiza" style="width: 100%; height: 100%; object-fit: contain; display: block;" />
      <!-- Marcadores dos pontos -->
      <!-- ALTERE OS VALORES DE LEFT E TOP ABAIXO PARA MUDAR A POSIÇÃO DO PONTO VERMELHO (IBIZA CENTRO) -->
      <div class="marker" id="marker-ibiza-centro" style="left: 50.3%; top: 66.0%; background: red; border: 2px solid #fff; width: 14px; height: 14px;" title="Ibiza Centro"></div>
      <!-- FIM DO TRECHO DE ALTERAÇÃO DA POSIÇÃO -->
      <div class="marker" id="marker-sant-antoni" style="left: 30%; top: 50%; background: orange; border: 2px solid #fff;" title="Sant Antoni"></div>
      <div class="marker" id="marker-ibiza-town" style="left: 70%; top: 60%; background: green; border: 2px solid #fff;" title="Ibiza Town"></div>
      <div class="marker" id="marker-disco-area" style="left: 58%; top: 28%; background: blue; border: 2px solid #fff;" title="Disco Area"></div>
      <div class="marker" id="marker-hippie" style="left: 30%; top: 22%; background: purple; border: 2px solid #fff;" title="North / Hippie"></div>
      <!-- Legenda -->
      <div style="position: absolute; left: 10px; bottom: 10px; background: rgba(255,255,255,0.9); padding: 10px 18px; border-radius: 10px; font-size: 15px; box-shadow: 0 2px 8px #0002;">
        <div style="margin-bottom: 4px;"><span style="display:inline-block;width:16px;height:16px;background:red;border-radius:50%;margin-right:6px;vertical-align:middle;"></span> Ibiza Centro</div>
        <div style="margin-bottom: 4px;"><span style="display:inline-block;width:16px;height:16px;background:orange;border-radius:50%;margin-right:6px;vertical-align:middle;"></span> Sant Antoni</div>
        <div style="margin-bottom: 4px;"><span style="display:inline-block;width:16px;height:16px;background:green;border-radius:50%;margin-right:6px;vertical-align:middle;"></span> Ibiza Town</div>
        <div style="margin-bottom: 4px;"><span style="display:inline-block;width:16px;height:16px;background:blue;border-radius:50%;margin-right:6px;vertical-align:middle;"></span> Disco Area</div>
        <div><span style="display:inline-block;width:16px;height:16px;background:purple;border-radius:50%;margin-right:6px;vertical-align:middle;"></span> North / Hippie</div>
      </div>
    </section>
  </main>

  <style>
    .marker {
      position: absolute;
      width: 22px;
      height: 22px;
      background: #1976d2;
      border: 2px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      box-shadow: 0 0 8px #0003;
      cursor: pointer;
    }
    #marker-ibiza-centro {
      background: red;
      border: 2px solid #fff;
      z-index: ;
      width: 10px;
      height: 10px;
    }
  </style>
  <script src="js/game.js"></script>
</body>
</html>
